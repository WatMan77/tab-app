name: testing

on:
  push:
    branches:
      - "*"
jobs:
  tests:
    name: backend-tests
    runs-on: ubuntu-latest

    services:
      test-db:
        image: postgres
        env:
          POSTGRES_USERNAME: postgres
          POSTGRES_DB: test-db
          POSTGRES_PASSWORD: test
          HOST: test-db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # ...
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      # run any `bun` or `bunx` command
      - run: bun install
        working-directory: ./backend
      - name: Setup tables
        working-directory: ./backend
        run: psql "postgresql://postgres:test@localhost/test-db" -f migrations/1_create_basics.sql
      - run: bun run test
        working-directory: ./backend
        env:
          CI: true
          SECRET: ${{ secrets.SECRET }}

  playwright-tests:
    name: Playwright tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get Bun
        uses: oven-sh/setup-bun@v1

      - run: bun install && bun run dev &
        working-directory: ./backend
        env:
          CI: true
          SECRET: ${{ secrets.SECRET }}

      - run: bun install && bun run dev &
        working-directory: ./frontend

      - run: bun install @playwright/test --with-deps && bunx playwright install
        working-directory: ./playwright

      - name: Run the playwright tests
        working-directory: ./playwright
        run: bun run test

    services:
      test-db:
        image: postgres
        env:
          POSTGRES_USERNAME: postgres
          POSTGRES_DB: test-db
          POSTGRES_PASSWORD: test
          HOST: test-db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
