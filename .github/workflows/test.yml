name: testing

on:
  push:
    branches:
      - "*"
jobs:
  tests:
    name: backend-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2]

    services:
      test-db:
        image: postgres
        env:
          POSTGRES_USERNAME: postgres
          POSTGRES_DB: test-db
          POSTGRES_PASSWORD: test
          HOST: test-db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # ...
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      # run any `bun` or `bunx` command
      - run: bun install
        working-directory: ./backend
      #- name: Setup tables
      #  working-directory: ./backend
      #  run: psql "postgresql://postgres:test@localhost/test-db" -f migrations/1_create_basics.sql
      #- name: Run knex migrations
      ##  working-directory: ./backend
      # run: bun install knex && bunx knex migrate:latest
      - name: Run tests (attempt ${{ matrix.attempt }})
        run: bun run test
        working-directory: ./backend
        env:
          CI: true
          SECRET: ${{ secrets.SECRET }}

  playwright-tests:
    name: Playwright tests
    runs-on: ubuntu-latest
    needs: [tests]
    if: ${{ always() && contains(join(needs.tests.result, ','), 'success')}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get Bun
        uses: oven-sh/setup-bun@v1

      - run: bun install && bun run dev &
        working-directory: ./backend
        env:
          CI: true
          SECRET: ${{ secrets.SECRET }}

      - run: bun install && bun run dev &
        working-directory: ./frontend

      - run: bun install @playwright/test --with-deps && bunx playwright install
        working-directory: ./playwright

      - name: Run the playwright tests
        working-directory: ./playwright
        run: bun run test

    services:
      test-db:
        image: postgres
        env:
          POSTGRES_USERNAME: postgres
          POSTGRES_DB: test-db
          POSTGRES_PASSWORD: test
          HOST: test-db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
