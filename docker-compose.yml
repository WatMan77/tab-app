services:
    db:
        image: postgres
        restart: always
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            HOST: db
        depends_on:
            - redis
    test-db:
        image: postgres
        restart: always
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        depends_on:
            - redis

    backend:
        build: ./backend
        restart: always
        ports:
            - 3000:3000
        environment:
            - HOST=db
            - NODE_ENV=production

    frontend:
        build: ./frontend
        restart: always
        ports:
            - 4173:4173
        expose:
            - "4173"
        depends_on:
            - backend
        environment:
            DOCKER: true

    redis:
        image: redis:latest
        restart: always
        ports:
            - 6379:6379

    caddy:
        image: caddy:latest
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
        depends_on:
            - frontend
