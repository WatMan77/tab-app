services:
    db:
        image: postgres
        restart: always
        container_name: tabapp-db
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            HOST: db
    test-db:
        image: postgres
        restart: always
        container_name: tabapp-test-db
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        depends_on:
            - redis

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        restart: always
        container_name: tabapp-backend
        ports:
            - 3000:3000
        # Supplies POSTGRES_*, SECRET and REDIS_URL. The path is relative to this compose file.
        # Without it the only route into the container would be baking backend/.env.production
        # into the image.
        env_file:
            - .env.production
        environment:
            # environment: wins over env_file:, so keep only what genuinely belongs to the image
            NODE_ENV: production

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                # Vite inlines VITE_* at build time, so this cannot be a runtime environment entry
                VITE_API_URL: ${VITE_API_URL:-}
        restart: always
        container_name: tabapp-frontend
        ports:
            - 4173:4173
        expose:
            - "4173"
        depends_on:
            - backend
        environment:
            DOCKER: true

    redis:
        image: redis:latest
        restart: always
        container_name: tabapp-redis
        ports:
            - 6379:6379

    caddy:
        image: caddy:latest
        container_name: tabapp-caddy
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
        depends_on:
            - frontend
