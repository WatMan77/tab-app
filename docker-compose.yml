services:
    db:
        image: postgres
        restart: always
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            HOST: db
    test-db:
        image: postgres
        restart: always
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            HOST: localhost

    backend:
        build: ./backend
        restart: always
        ports:
            - 3000:3000
        environment:
            - HOST=db
            - NODE_ENV=production

    frontend:
        build: ./frontend
        restart: always
        ports:
            - 4173:4173
        depends_on:
            - backend
        environment:
            DOCKER: true

    redis:
        image: redis:latest
        restart: always
        ports:
            - 6379:6379